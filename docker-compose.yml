# Everything in one stack: the ERPNext/Frappe Bench plus the hosting platform.
#
#   docker compose up -d --build
#
# All services are namespaced (`frappe-*` for the Bench, `platform-*` for the
# hosting platform) and the project is pinned below, so `docker ps` shows
# `erpnext-<service>-1` unambiguously no matter where the repo lives.
#
# The Frappe services follow the official frappe_docker `pwd.yml`
# (https://github.com/frappe/frappe_docker). Pin ERPNEXT_VERSION to the version
# you deploy. The worker is built FROM the same ERPNext image so it can run
# `bench` against the shared sites volume.
#
# Values such as PUBLIC_BASE_URL, TRUEMOI_*, SESSION_COOKIE_SECRET and
# PROVISIONING_BASE_DOMAIN are read from the project `.env` (see .env.example).

name: ${COMPOSE_PROJECT_NAME:-erpnext}

x-frappe-common: &frappe-common
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.51.1}
  networks: [erpnext]
  restart: unless-stopped
  volumes:
    - frappe-sites:/home/frappe/frappe-bench/sites
    - frappe-logs:/home/frappe/frappe-bench/logs

services:
  # ── Platform ────────────────────────────────────────────────────────────
  platform-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [erpnext]
    environment:
      POSTGRES_USER: erpnext
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-erpnext}
      POSTGRES_DB: erpnext_platform
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    ports:
      # Published for local `pnpm dev` (DATABASE_URL uses localhost). Change the
      # host side if something else already owns 5432.
      - "${PLATFORM_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpnext -d erpnext_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    networks: [erpnext]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://erpnext:${PLATFORM_DB_PASSWORD:-erpnext}@platform-postgres:5432/erpnext_platform
    ports:
      # Host port is configurable so this stack can coexist with other
      # containers; the in-container port stays fixed at 3000.
      - "${PLATFORM_API_PORT:-3000}:3000"
    depends_on:
      platform-postgres:
        condition: service_healthy
      frappe-backup-volume-init:
        condition: service_completed_successfully
    volumes:
      - frappe-backups:/home/frappe/frappe-bench/archived-backups:ro

  platform-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-v16.51.1}
    # Skip Frappe's asset-link entrypoint and bypass Corepack for worker startup.
    entrypoint: ["/bin/bash", "-c"]
    command: ["umask 0002; exec ./node_modules/.bin/tsx src/worker-entry.ts"]
    restart: unless-stopped
    networks: [erpnext]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://erpnext:${PLATFORM_DB_PASSWORD:-erpnext}@platform-postgres:5432/erpnext_platform
      BENCH_PATH: /home/frappe/frappe-bench
      BENCH_BIN: bench
      MARIADB_HOST: frappe-db
      PROVISION_ROUTING_MODE: ${PROVISION_ROUTING_MODE:-skip}
      HEALTHCHECK_BASE_URL: http://frappe-frontend:8080
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites
      - frappe-logs:/home/frappe/frappe-bench/logs
      - frappe-backups:/home/frappe/frappe-bench/archived-backups
    depends_on:
      platform-postgres:
        condition: service_healthy
      frappe-configurator:
        condition: service_completed_successfully
      frappe-backup-volume-init:
        condition: service_completed_successfully

  frappe-backup-volume-init:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.51.1}
    user: root
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - mkdir -p /backup && chown -R 1000:0 /backup && chmod 2770 /backup
    volumes:
      - frappe-backups:/backup

  # ── Frappe Bench (adapted from frappe_docker pwd.yml) ───────────────────
  frappe-backend:
    <<: *frappe-common
    environment:
      DB_HOST: frappe-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    depends_on:
      frappe-configurator:
        condition: service_completed_successfully

  frappe-configurator:
    <<: *frappe-common
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g db_root_password "$$MARIADB_ROOT_PASSWORD";
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: frappe-db
      DB_PORT: "3306"
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      REDIS_CACHE: frappe-redis-cache:6379
      REDIS_QUEUE: frappe-redis-queue:6379
      SOCKETIO_PORT: "9000"

  frappe-create-site:
    <<: *frappe-common
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 120 frappe-db:3306;
        wait-for-it -t 120 frappe-redis-cache:6379;
        wait-for-it -t 120 frappe-redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/${BOOTSTRAP_SITE:-frontend}" ]; then
          echo "Site ${BOOTSTRAP_SITE:-frontend} already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%'
            --admin-password=$$ERPNEXT_ADMIN_PASSWORD
            --mariadb-root-password=$$MARIADB_ROOT_PASSWORD
            --install-app erpnext
            --set-default ${BOOTSTRAP_SITE:-frontend};
        fi;
    environment:
      BOOTSTRAP_SITE: ${BOOTSTRAP_SITE:-frontend}
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}

  frappe-db:
    image: mariadb:11.8
    restart: unless-stopped
    networks: [erpnext]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    volumes:
      - frappe-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

  frappe-frontend:
    <<: *frappe-common
    depends_on: [frappe-backend, frappe-websocket]
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: frappe-backend:8000
      SOCKETIO: frappe-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
      # Host-based multitenancy: the backend resolves the site from the Host
      # header, so we intentionally do NOT pin FRAPPE_SITE_NAME_HEADER.
    ports:
      - "${FRAPPE_HTTP_PORT:-8080}:8080"

  frappe-queue-long:
    <<: *frappe-common
    command: [bench, worker, --queue, "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-redis-queue:6379
    depends_on:
      frappe-configurator:
        condition: service_completed_successfully

  frappe-queue-short:
    <<: *frappe-common
    command: [bench, worker, --queue, "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-redis-queue:6379
    depends_on:
      frappe-configurator:
        condition: service_completed_successfully

  frappe-scheduler:
    <<: *frappe-common
    command: [bench, schedule]
    depends_on:
      frappe-configurator:
        condition: service_completed_successfully

  frappe-websocket:
    <<: *frappe-common
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-redis-queue:6379
    depends_on:
      frappe-configurator:
        condition: service_completed_successfully

  frappe-redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks: [erpnext]

  frappe-redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks: [erpnext]
    volumes:
      - frappe-redis-queue-data:/data

  # Test-only PostgreSQL for the opt-in integration test (host port 5433).
  # Opt-in via profile so production deploys never start it.
  platform-postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    restart: unless-stopped
    networks: [erpnext]
    environment:
      POSTGRES_USER: erpnext
      POSTGRES_PASSWORD: erpnext
      POSTGRES_DB: erpnext_platform_test
    ports:
      - "${PLATFORM_TEST_DB_PORT:-5433}:5432"

volumes:
  platform-postgres-data:
  frappe-db-data:
  frappe-redis-queue-data:
  frappe-sites:
  frappe-logs:
  frappe-backups:

networks:
  erpnext:
    driver: bridge
